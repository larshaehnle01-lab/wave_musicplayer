
name: WAVE Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android API 36 installieren
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        run: gradle --no-daemon :app:assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: WAVE-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
