const normalizeAudio=a=>{const d=blankAudio(),x=a&&typeof a==='object'?a:{};return {bass:clamp(x.bass??d.bass,0,48),vocal:clamp(x.vocal??d.vocal,-18,18),presence:clamp(x.presence??d.presence,-18,18),treble:clamp(x.treble??d.treble,-18,18),eq:Array.from({length:10},(_,i)=>clamp(Array.isArray(x.eq)?x.eq[i]:0,-18,18)),speed:clamp(x.speed??1,.5,2.5),reverb:clamp(x.reverb??0,0,60),pitchPreserve:x.pitchPreserve!==false}};

function showStorageBanner(){const b=$('storageBanner');if(!b)return;if(storageStatus==='ok'){b.hidden=true;return}b.hidden=false;b.textContent=storageStatus==='temporary'?'⚠️ WAVE läuft im temporären Speichermodus: Playlists funktionieren jetzt, gehen beim Schließen/Neuladen aber möglicherweise verloren. Exportiere wichtige Playlists sofort. Für dauerhaften Speicher WAVE in Chrome/Firefox/Safari außerhalb einer Dateivorschau öffnen.':'⚠️ Eingeschränkter Browserspeicher. Manche Änderungen können nach dem Schließen verloren gehen. Bitte WAVE im normalen Browser öffnen.'}
function toast(msg){const root=$('toastRoot');root.replaceChildren();const d=document.createElement('div');d.className='toast';d.textContent=msg;root.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.replaceChildren(),4300)}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('wave-music-v1',2);r.onupgradeneeded=()=>{const d=r.result;for(const n of ['songs','playlists','prefs'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function store(n,mode='readonly'){return db.transaction(n,mode).objectStore(n)}
function dbRead(n,key){return new Promise((ok,no)=>{const r=store(n).get(key);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbAll(n){return new Promise((ok,no)=>{const r=store(n).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbPut(n,v){return new Promise((ok,no)=>{const r=store(n,'readwrite').put(v);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function dbDelete(n,k){return new Promise((ok,no)=>{const r=store(n,'readwrite').delete(k);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function dbBatch(songRecords,playlistRecord){return new Promise((ok,no)=>{const t=db.transaction(['songs','playlists'],'readwrite');for(const r of songRecords)t.objectStore('songs').put(r);t.objectStore('playlists').put(playlistRecord);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
const LOCAL_PLAYLISTS_KEY='wave-playlist-fallback-v1';
function readFallbackPlaylists(){try{const data=JSON.parse(localStorage.getItem(LOCAL_PLAYLISTS_KEY)||'[]');return Array.isArray(data)?data.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string').slice(0,500):[]}catch{return []}}
function writeFallbackPlaylists(items){try{localStorage.setItem(LOCAL_PLAYLISTS_KEY,JSON.stringify(items))}catch(e){throw new Error('Browser-Speicher ist gesperrt. Erlaube lokale Website-Daten oder öffne die Datei im normalen Browserfenster.')}}
async function persistPlaylist(p){
 // IndexedDB is preferred. Do not silently fail if the file preview/browser denies all storage.
 if(db){try{await dbPut('playlists',p);temporaryPlaylists=temporaryPlaylists.filter(x=>x.id!==p.id);return 'indexeddb'}catch(e){console.warn('IndexedDB write blocked',e)}}
 try{const local=readFallbackPlaylists();const idx=local.findIndex(x=>x.id===p.id);if(idx>=0)local[idx]=p;else local.push(p);writeFallbackPlaylists(local);temporaryPlaylists=temporaryPlaylists.filter(x=>x.id!==p.id);storageStatus='limited';showStorageBanner();return 'localStorage'}
 catch(e){console.warn('Persistent browser storage unavailable; saving playlist only in memory',e);const idx=temporaryPlaylists.findIndex(x=>x.id===p.id);if(idx>=0)temporaryPlaylists[idx]=p;else temporaryPlaylists.push(p);storageStatus='temporary';showStorageBanner();return 'temporary'}
}
async function removePlaylistRecord(id){
 if(db)try{await dbDelete('playlists',id)}catch(e){console.warn(e)}
 try{writeFallbackPlaylists(readFallbackPlaylists().filter(p=>p.id!==id))}catch(e){console.warn(e)}
 temporaryPlaylists=temporaryPlaylists.filter(p=>p.id!==id)
}
async function reload(){
 try{songs=db?(await dbAll('songs')).sort((a,b)=>(b.added||0)-(a.added||0)):[]}catch(e){console.warn(e);songs=[];storageStatus='temporary'}
 let records=[];try{records=db?await dbAll('playlists'):[]}catch(e){console.warn(e);storageStatus='temporary'}
 const merged=new Map([...records,...readFallbackPlaylists(),...temporaryPlaylists].map(p=>[p.id,p]));playlists=[...merged.values()].sort((a,b)=>(b.created||0)-(a.created||0));render();updatePlayer();showStorageBanner()
}

function coverUrl(id,blob){if(!(blob instanceof Blob))return '';const cached=coverUrls.get(id);if(cached&&cached.blob===blob)return cached.url;if(cached)URL.revokeObjectURL(cached.url);const url=URL.createObjectURL(blob);coverUrls.set(id,{blob,url});return url}

function setTheme(){document.body.classList.toggle('light',prefs.theme==='light');document.documentElement.style.setProperty('--accent',prefs.accent);const h=prefs.accent.replace('#',''),rgb=[0,2,4].map(i=>parseInt(h.substring(i,i+2),16));document.documentElement.style.setProperty('--accentInk',(rgb[0]*.299+rgb[1]*.587+rgb[2]*.114)>165?'#0b1612':'#ffffff');document.documentElement.style.setProperty('--radius',`${prefs.roundness}px`);document.documentElement.style.setProperty('--blur',`${prefs.blur}px`);if(wallpaperUrl){URL.revokeObjectURL(wallpaperUrl);wallpaperUrl=null}if(prefs.wallpaper instanceof Blob)wallpaperUrl=URL.createObjectURL(prefs.wallpaper);document.documentElement.style.setProperty('--wallpaper',wallpaperUrl?`url("${wallpaperUrl}")`:'none');$('volume').value=prefs.volume;audio.volume=prefs.volume}

function viewHome(){const latest=songs.slice(0,5),top=songs.filter(s=>s.playCount).sort((a,b)=>(b.playCount||0)-(a.playCount||0)).slice(0,4);return `${pageHead('YOUR SOUND. YOUR RULES.','Willkommen bei WAVE.', 'Deine private Musiksammlung – genau so, wie du sie haben willst.')}<div class="hero"><div><div class="info-chip">WAVE MUSIC STUDIO</div><h2>Mach jeden Song<br>zu deinem Sound.</h2><p>MP3s hochladen, Playlists teilen und mit dem Audio Studio eigene Soundprofile erstellen. Auf Android hängt die maximale Bassverstärkung von der Hardware ab.</p><div class="toolbar">${button(ic('upload')+' Musik hochladen','pick-mp3','','btn primary')}${button(ic('sliders')+' Audio Studio','studio-global')}</div></div><div class="hero-visual">${[45,86,120,72,137,96,50,90].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div><div class="stat-grid"><div class="stat">${ic('music')}<strong>${songs.length}</strong><small>Songs in der Bibliothek</small></div><div class="stat">${ic('list')}<strong>${playlists.length}</strong><small>Deine Playlists</small></div><div class="stat">${ic('headphones')}<strong>${compactTime(prefs.totalSeconds)}</strong><small>Gesamte Hörzeit</small></div><div class="stat">${ic('heart')}<strong>${songs.filter(s=>s.liked).length}</strong><small>Favoriten</small></div></div><div class="sect-head"><h2>Zuletzt hochgeladen</h2>${button('Alle Songs '+ic('arrow',14),'go-songs','','btn mini')}</div>${songList(latest)}${top.length?`<div class="sect-head"><h2>Deine Hits</h2>${button('Statistiken','go-stats','','btn mini')}</div>${songList(top)}`:''}`}

/* WAVE Android native playback adapter. Bundled and enabled only inside our app. */
if (window.WAVEAndroid) {
  const bridge = window.WAVEAndroid;
  let nativeState = {ready:false,playing:false,id:'',position:0,duration:0};
  let nativeTransferSequence = Promise.resolve();
  let nativePrevTime = Date.now();
  const originalUploadFiles = uploadFiles;
  const originalReload = reload;
  const originalDeleteSong = actions['delete-song'];

  function nativeAudioPart(arrayBuffer) {
    const a = new Uint8Array(arrayBuffer);
    let chars = '';
    for (let i = 0; i < a.length; i += 8192)
      chars += String.fromCharCode(...a.subarray(i, i+8192));
    return btoa(chars);
  }
  async function nativeEnsureNow(song) {
    if (bridge.hasAudio(song.id)) return;
    if (!song.blob || !song.blob.size) throw Error('MP3-Daten fehlen');
    if (!bridge.beginAudio(song.id, song.blob.size)) throw Error('Android-Speicher konnte nicht geöffnet werden');
    try {
      const blockSize = 64*1024;
      for (let offset=0; offset<song.blob.size; offset+=blockSize) {
        const data = await song.blob.slice(offset,offset+blockSize).arrayBuffer();
        if (!bridge.audioPart(song.id,nativeAudioPart(data))) throw Error('MP3-Übertragung fehlgeschlagen');
        if ((offset / blockSize) % 20 === 0) await new Promise(resolve=>setTimeout(resolve,0));
      }
      if (!bridge.endAudio(song.id)) throw Error('MP3 wurde unvollständig übertragen');
    } catch(err) { bridge.abandonAudio(song.id); throw err; }
  }
  function nativeEnsure(song) {
    // Serialize transfers; Android bridge stores exactly one partial file at a time.
    const job = nativeTransferSequence.catch(()=>{}).then(()=>nativeEnsureNow(song));
    nativeTransferSequence = job.catch(()=>{});
    return job;
  }
  async function nativeSyncLibrary() {
    for (const song of songs) {
      if (bridge.hasAudio(song.id)) continue;
      try { await nativeEnsure(song); }
      catch (err) { console.warn('Android MP3 sync', song.title, err); }
    }
  }
  uploadFiles = async function(files) {
    await originalUploadFiles(files);
    nativeSyncLibrary();
  };
  reload = async function() {
    await originalReload();
    // Imported playlist MP3s are also cached for native background playback.
    if (songs.length) nativeSyncLibrary();
  };
  function nativeQueue() {
    const q = queue.length ? queue : songs.map(s=>s.id);
    return q.map(id => songs.find(s=>s.id===id))
      .filter(s=>s && bridge.hasAudio(s.id))
      .map(s=>({id:s.id,title:s.title,artist:s.artist}));
  }
  playSong = async function(id, contextPlaylist=null, keepQueue=false) {
    const s=songs.find(x=>x.id===id);
    if (!s) {toast('Song nicht gefunden');return}
    flushListening();
    if (!keepQueue) {
      activePlaylist=contextPlaylist;
      queue=contextPlaylist?(playlists.find(p=>p.id===contextPlaylist)?.songIds||[]).filter(k=>songs.some(x=>x.id===k)):filteredSongs().map(x=>x.id);
      if (!queue.includes(id)) queue.unshift(id);
    }
    if (id!==currentId) {currentId=id;trackStart(s);}
    updatePlayer();
    try {
      if (!bridge.hasAudio(id)) toast('Song wird für Android vorbereitet …');
      await nativeEnsure(s);
      bridge.play(id,JSON.stringify(nativeQueue()));
      bridge.repeat(prefs.repeat);
      bridge.shuffle(!!prefs.shuffle);
      applySound();
    } catch(err) {console.error(err);toast('Android-Wiedergabe fehlgeschlagen: '+err.message);}
  };
  nextTrack = function(step=1) {
    if (step<0) bridge.previous(); else bridge.next();
  };
  applySound = function() {
    try {const profile=playerSourceProfile();profile.volume=prefs.volume;bridge.sound(JSON.stringify(profile));}
    catch(err){console.warn('Native EQ',err);}
  };
  updatePlayer = function() {
    const s=songs.find(s=>s.id===currentId);
    $('nowTitle').textContent=s?.title||'Deine Musik wartet.';
    $('nowArtist').textContent=s?.artist||'MP3s hochladen und loslegen';
    $('nowArt').innerHTML=s?.cover?`<img src="${coverUrl(s.id,s.cover)}" alt="">`:'♫';
    $('likePlaying').textContent=s?.liked?'♥':'♡';
    $('likePlaying').style.color=s?.liked?'var(--accent)':'var(--muted)';
    $('playBtn').innerHTML=ic(nativeState.playing?'pause':'play',19);
    $('shuffleBtn').classList.toggle('active',!!prefs.shuffle);
    $('repeatBtn').classList.toggle('active',prefs.repeat!=='off');
    $('repeatBtn').textContent=prefs.repeat==='one'?'↻¹':'↻';
    $('timePos').textContent=fmt(nativeState.position/1000);
    $('timeLength').textContent=fmt(nativeState.duration/1000);
    if (!seekBusy) $('seek').value=nativeState.duration?Math.round(nativeState.position/nativeState.duration*1000):0;
  };
  function updateNativeListening() {
    const now=Date.now();
    const elapsed=Math.max(0,(now-nativePrevTime)/1000);nativePrevTime=now;
    if (nativeState.playing && currentId && elapsed<1200) {
      listenPending += elapsed;
      if(listenPending>=9)flushListening();
    }
  }
  updateListening = updateNativeListening;
  function nativePoll() {
    try {
      const state=JSON.parse(bridge.state());
      updateNativeListening();
      nativeState=state;
      if (state.id && currentId!==state.id) {
        flushListening();
        currentId=state.id;
        // Native notification/BT next-track also updates WAVE's song display.
        const s=songs.find(x=>x.id===state.id);if(s)trackStart(s);
      }
      updatePlayer();
    } catch(err) { console.warn('Native playback state',err); }
  }
  setInterval(nativePoll,800);
  document.addEventListener('visibilitychange',()=>{nativePrevTime=Date.now(); nativePoll();});
  $('playBtn').onclick=async()=>{
    if (!currentId) { if(songs.length)await playSong(songs[0].id);else goto('upload');return; }
    bridge.toggle();setTimeout(nativePoll,150);
  };
  $('prevBtn').onclick=()=>bridge.previous();
  $('nextBtn').onclick=()=>bridge.next();
  $('seek').onchange=e=>{if(nativeState.duration)bridge.seek(Math.floor(nativeState.duration*Number(e.target.value)/1000));seekBusy=false;};
  $('seek').oninput=e=>{if(nativeState.duration)$('timePos').textContent=fmt(nativeState.duration*Number(e.target.value)/1000000);};
  $('volume').oninput=e=>{prefs.volume=clamp(e.target.value,0,1);savePrefs();audio.volume=prefs.volume;applySound();};
  const originalRepeat = actions['toggle-repeat'];
  const originalShuffle = actions['toggle-shuffle'];
  actions['toggle-repeat'] = function() { const r=originalRepeat();bridge.repeat(prefs.repeat);return r;};
  actions['toggle-shuffle'] = function() {const r=originalShuffle();bridge.shuffle(!!prefs.shuffle);return r;};
  actions['delete-song'] = function(id) {
    const s=songs.find(s=>s.id===id);if(!s)return;
    showModal(`<h2>Song löschen?</h2><p class="muted">${esc(s.title)} wird aus WAVE entfernt.</p><div class="dialog-foot">${button('Abbrechen','close-modal')}${button('Endgültig löschen','android-delete-song',`data-id="${id}"`,'btn danger')}</div>`);
  };
  actions['android-delete-song'] = async function(id) {
    const s=songs.find(s=>s.id===id);if(!s)return;
    if(currentId===id){bridge.stop();currentId=null;}
    await dbDelete('songs',id);
    bridge.deleteAudio(id);
    for(const p of playlists){p.songIds=p.songIds.filter(x=>x!==id);await persistPlaylist(p);}
    closeModal();await reload();toast('Song gelöscht');
  };

  // Export .waveplaylist files using Android's save dialog, not blob: downloads
  // (Android WebView cannot automatically download blob: links).
  downloadBlob = async function(blob,name) {
    if (!/^[a-zA-Z0-9_ äöüÄÖÜß.\-]{1,85}\.(waveplaylist|wavepreset)$/.test(name)) {
      toast('Unzulässiger Dateiname');return;
    }
    if(!bridge.beginExport(name,blob.size)) {toast('Export nicht möglich');return;}
    try {
      for(let offset=0;offset<blob.size;offset+=64*1024) {
        const raw=await blob.slice(offset,offset+64*1024).arrayBuffer();
        if(!bridge.exportPart(nativeAudioPart(raw)))throw Error('Export-Übertragung unterbrochen');
      }
      if(!bridge.finishExport())throw Error('Export konnte nicht abgeschlossen werden');
      toast('Speicherort für '+name+' auswählen');
    } catch(err) {console.error(err);toast('Exportfehler: '+err.message)}
  };
  // Keep WebAudio's huge +48 dB UI as design, but native EQ is device-limited.
  const badge=document.createElement('div');
  badge.textContent='ANDROID · HINTERGRUND-MUSIK';
  badge.style.cssText='position:fixed;right:9px;top:4px;font-size:9px;letter-spacing:1.2px;color:var(--accent);z-index:20;pointer-events:none;opacity:.9';
  document.body.appendChild(badge);
  const msg=document.createElement('span');msg.style.display='none';msg.textContent='WAVE Android';document.body.append(msg);
}
